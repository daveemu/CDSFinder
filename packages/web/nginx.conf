server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's internal DNS — resolves service names dynamically per request
    # so nginx starts even if the api container is not yet healthy.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $upstream http://api:3001;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
